    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - aegiscase-net

  # ── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    # The FE repo is a SIBLING folder of this one on the same machine.
    # It builds a static React+Vite SPA and serves it with nginx (port 80).
    build:
      context: ../AegisCase_FE
      dockerfile: Dockerfile
      args:
        # VITE_* vars are INLINED AT BUILD TIME. This is the PUBLIC gateway URL
        # the browser hits on the host — NOT an internal Docker hostname.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    container_name: aegiscase-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-4200}:80'
    depends_on:
      - api-gateway
    networks:
      - aegiscase-net
